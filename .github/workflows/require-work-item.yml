name: Require Work Item In PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-work-item:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description for work item
        uses: actions/github-script@v7
        with:
          script: |
            const body = String(context.payload.pull_request?.body || '');
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            const hasSection = /##\s*Work Item/i.test(body);
            const hasGitHubIssueRef = /(Fixes|Closes|Resolves)\s+#\d+/i.test(body);
            const hasIssueUrl = new RegExp(`${repoUrl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\/issues\/\\d+`, 'i').test(body);

            const hasReference = hasGitHubIssueRef || hasIssueUrl;

            if (!hasSection || !hasReference) {
              core.setFailed(
                [
                  'Missing required work item information in PR description.',
                  'Required:',
                  '1) Include a "## Work Item" section.',
                  '2) Include at least one GitHub issue reference from this repo: Fixes/Closes/Resolves #<id> or full issue URL.'
                ].join('\n')
              );
              return;
            }

            console.log('Work item reference found.');
