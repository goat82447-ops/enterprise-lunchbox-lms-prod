name: OpenAI ChatGPT Healing Agent

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: openai-healing-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  heal-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_BASE_URL: ${{ vars.OPENAI_API_BASE_URL || 'https://api.openai.com/v1' }}
      OPENAI_MODEL: 'gpt-4o-mini'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Validate OpenAI configuration
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "Missing required secret: OPENAI_API_KEY" >&2
            exit 1
          fi
          if [ -z "${OPENAI_MODEL}" ]; then
            echo "Missing required variable: OPENAI_MODEL" >&2
            exit 1
          fi

      - name: Analyze issue and publish diagnostics
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!issueNumber) {
              core.info('No issue context available (workflow_dispatch without issue payload). Skipping.');
              return;
            }

            const baseUrl = process.env.OPENAI_API_BASE_URL;
            const model = process.env.OPENAI_MODEL;
            const apiKey = process.env.OPENAI_API_KEY;

            const prompt = `Issue title: ${process.env.ISSUE_TITLE}

Issue body:
${process.env.ISSUE_BODY}

Return markdown with these exact headings:
## Error Observed
## Root Cause
## Resolution
## Validation Steps

Rules:
- Use only evidence from the issue text/logs.
- Do not guess.
- If exact root cause is not provable from provided details, write "Insufficient evidence for exact root cause" and list exactly what logs/steps are missing.
- In Resolution, provide only actions tied to observed evidence.
- Keep response concise and actionable.`;

            let content = '';
            let apiError = '';

            try {
              const response = await fetch(`${baseUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model,
                  temperature: 0.2,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a software issue healing assistant for a production repository. Never invent facts. Provide exact root cause only when evidence is sufficient; otherwise explicitly mark insufficient evidence and request required logs.'
                    },
                    {
                      role: 'user',
                      content: prompt
                    }
                  ]
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                apiError = `OpenAI API request failed (${response.status}): ${errorText.slice(0, 1000)}`;
              } else {
                const data = await response.json();
                content = data?.choices?.[0]?.message?.content?.trim() || '';
                if (!content) {
                  apiError = 'OpenAI API returned no message content.';
                }
              }
            } catch (err) {
              apiError = `OpenAI API request threw an exception: ${String(err).slice(0, 1000)}`;
            }

            const body = apiError
              ? [
                  `## OpenAI Healing Agent (${model})`,
                  '',
                  '### Error Observed',
                  'OpenAI analysis step failed before generating diagnostics.',
                  '',
                  '### Root Cause',
                  apiError,
                  '',
                  '### Resolution',
                  '1. Verify `OPENAI_API_KEY` repository secret is valid and active.',
                  '2. Verify the account has API billing/credits enabled.',
                  '3. Re-run this workflow after updating the secret.',
                  '',
                  '> Automated fallback comment because model analysis failed.'
                ].join('\n')
              : [
                  `## OpenAI Healing Agent (${model})`,
                  '',
                  content,
                  '',
                  '> Generated automatically from the current issue details.'
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            await core.summary
              .addHeading(`OpenAI Healing Agent (${model})`)
              .addRaw(apiError ? '**Status:** Failed to analyze with OpenAI' : '**Status:** Analysis posted successfully')
              .addEOL()
              .addEOL()
              .addRaw(apiError ? `**Error:** ${apiError}` : 'Issue comment posted with structured diagnostics.')
              .write();

            if (apiError) {
              core.setFailed(apiError);
            }
