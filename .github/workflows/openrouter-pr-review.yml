name: Krishna TARS-PROXIMA 🔍 PR Reviewer

# Automatically reviews every pull request and posts review comments on your
# behalf using OpenRouter. Mirrors the conventions of the healing agent
# (openrouter/auto + OPENROUTER_API_KEY + actions/github-script@v8).

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: open_router-pr-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review-pr:
    # Skip draft PRs; review everything else.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_BASE_URL: ${{ vars.OPENROUTER_API_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENROUTER_MODEL: 'openrouter/auto'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Missing required secret: OPENROUTER_API_KEY" >&2
            exit 1
          fi

      - name: Review pull request and post comments
        uses: actions/github-script@v8
        env:
          OPENROUTER_API_BASE_URL: ${{ env.OPENROUTER_API_BASE_URL }}
          OPENROUTER_MODEL: ${{ env.OPENROUTER_MODEL }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
          PR_REVIEW_ASSIGNEE: ${{ vars.PR_REVIEW_ASSIGNEE || '' }}
          REVIEWER_NAME: ${{ vars.PR_REVIEWER_NAME || 'Krishna' }}
        with:
          # If you add a Personal Access Token for the "Krishna" GitHub account as
          # the secret REVIEWER_PAT, every comment/review below is posted AS that
          # account (the author shows "Krishna"). Without it, falls back to the
          # default token and posts as github-actions[bot] but still titled Krishna.
          github-token: ${{ secrets.REVIEWER_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const baseUrl = process.env.OPENROUTER_API_BASE_URL;
            const model   = process.env.OPENROUTER_MODEL;
            const apiKey  = process.env.OPENROUTER_API_KEY;
            const reviewerName = (process.env.REVIEWER_NAME || 'Krishna').trim();

            // Resolve the PR number from either the event or manual dispatch.
            const prNumber = Number(
              context.payload.pull_request?.number || process.env.INPUT_PR_NUMBER || 0
            );
            if (!prNumber) {
              core.info('No pull request number available. Skipping.');
              return;
            }

            const { owner, repo } = context.repo;

            // Fetch PR metadata.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber
            });

            // Fetch the changed files + their patches (paginated).
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100
            });

            if (!files.length) {
              core.info('No changed files found on the PR. Skipping.');
              return;
            }

            // Build a bounded diff context. Skip vendored / build / lock files
            // and very large generated files so the budget goes to real code.
            const SKIP = /(^|\/)(node_modules|dist|bin|obj)\//i;
            const SKIP_NAME = /(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|\.min\.(js|css)|\.map)$/i;

            let diffText = '';
            const MAX_DIFF = 200000; // chars
            const includedFiles = [];
            for (const f of files) {
              if (SKIP.test(f.filename) || SKIP_NAME.test(f.filename)) continue;
              const header =
                `\n=== FILE: ${f.filename} (status: ${f.status}, +${f.additions} -${f.deletions}) ===\n`;
              const patch = f.patch ? f.patch : '[no textual diff available — binary or too large]';
              if (diffText.length + header.length + patch.length > MAX_DIFF) {
                diffText += `\n[diff truncated — remaining files omitted to fit the review budget]\n`;
                break;
              }
              diffText += header + patch + '\n';
              includedFiles.push(f.filename);
            }

            if (!diffText.trim()) {
              core.info('No reviewable textual diff (only vendored/binary/lock files). Skipping.');
              return;
            }

            const prompt = [
              `You are reviewing pull request #${prNumber} in ${owner}/${repo}.`,
              '',
              `PR title: ${pr.title}`,
              'PR description:',
              (pr.body || '(no description provided)'),
              '',
              `Base branch: ${pr.base.ref}  ->  Head branch: ${pr.head.ref}`,
              `Files changed: ${includedFiles.length}`,
              '',
              `TASK: Act as a careful senior code reviewer named "${reviewerName}". Review the unified diff below and give actionable, specific feedback. Reference exact file paths and line numbers from the diff where possible.`,
              '',
              'Format your review EXACTLY in this structure (use these exact section headings):',
              '- First, a one or two sentence overall summary of the change and its main risk.',
              '- "MUST_FIX (N)" — blocking issues: bugs, security problems (OWASP Top 10: injection, auth/authorization, secrets, unsafe input, XSS, SSRF, etc.), or broken behaviour/UI. Number each item. If none, write "MUST_FIX (0)" with no items.',
              '- "SHOULD_FIX (N)" — important but non-blocking improvements (correctness edge cases, missing tests, maintainability). Number each item.',
              '- "NIT (N)" — minor/style/readability suggestions. Number each item.',
              'For every item, start with the relevant `path/to/file` then concretely explain the problem AND the concrete fix.',
              'For HTML/CSS/SCSS/template changes, explicitly check responsiveness: mobile (<=480px), tablet (<=768px), desktop, hard-coded widths, removed @media queries, and tap-target/accessibility issues.',
              '',
              'Then end with one line exactly in this form:',
              'VERDICT: APPROVE | COMMENT | REQUEST_CHANGES',
              '- Use APPROVE only if MUST_FIX is empty and you found no blocking issues.',
              '- Use REQUEST_CHANGES if there is any MUST_FIX item (bug, security, or broken UI).',
              '- Use COMMENT when there are only SHOULD_FIX / NIT items.',
              '',
              'Be concise and concrete. Do not invent code that is not in the diff. Use markdown with short bullet points.',
              '',
              '── UNIFIED DIFF ──',
              diffText
            ].join('\n');

            let content = '';
            let apiError = '';
            try {
              const response = await fetch(`${baseUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
                  'X-Title': `${process.env.GITHUB_REPOSITORY} PR Review`
                },
                body: JSON.stringify({
                  model,
                  temperature: 0.2,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a meticulous, constructive senior software engineer reviewing a pull request. You focus on correctness, security (OWASP Top 10), responsive UI on desktop and mobile, and maintainability. You give specific, actionable feedback referencing real files and lines, and you never approve code that contains bugs or security issues.'
                    },
                    { role: 'user', content: prompt }
                  ]
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                apiError = `API request failed (${response.status}): ${errorText.slice(0, 800)}`;
              } else {
                const data = await response.json();
                content = data?.choices?.[0]?.message?.content?.trim() || '';
                if (!content) apiError = 'API returned no content.';
              }
            } catch (err) {
              apiError = `API exception: ${String(err).slice(0, 800)}`;
            }

            if (apiError) {
              core.warning(apiError);
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: [
                  `## 🤖 ${reviewerName} Review`,
                  '',
                  '### Error',
                  apiError,
                  '',
                  '> Verify the `OPENROUTER_API_KEY` secret and account credits.'
                ].join('\n')
              });
              return;
            }

            // Map the model verdict to a GitHub review event.
            let event = 'COMMENT';
            const verdictMatch = content.match(/VERDICT:\s*(APPROVE|REQUEST_CHANGES|COMMENT)/i);
            if (verdictMatch) {
              const v = verdictMatch[1].toUpperCase();
              if (v === 'APPROVE') event = 'APPROVE';
              else if (v === 'REQUEST_CHANGES') event = 'REQUEST_CHANGES';
            }

            // Note: GitHub does not allow APPROVE / REQUEST_CHANGES on a PR you
            // authored via the default GITHUB_TOKEN. If createReview rejects the
            // event we fall back to a plain comment below.
            const reviewEvent = event;

            // Determine the review cycle number (how many times this reviewer has
            // already reviewed this PR), so the heading reads "Cycle 1", "Cycle 2"...
            let cycle = 1;
            try {
              const prevReviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100
              });
              const marker = `${reviewerName} Review`;
              const prior = prevReviews.filter(r => (r.body || '').includes(marker)).length;
              cycle = prior + 1;
            } catch (e) {
              core.warning(`Could not determine review cycle: ${e.message}`);
            }

            const reviewBody = [
              `## 🤖 ${reviewerName} Review — Cycle ${cycle}`,
              '',
              content,
              '',
              `> Automated review of ${includedFiles.length} changed file(s) by ${reviewerName}. Treat as advisory — a human should confirm before merge.`
            ].join('\n');

            try {
              await github.rest.pulls.createReview({
                owner, repo, pull_number: prNumber,
                event: reviewEvent,
                body: reviewBody
              });
              core.info(`Posted ${reviewEvent} review on PR #${prNumber}`);
            } catch (e) {
              // Most common cause: cannot APPROVE/REQUEST_CHANGES your own PR.
              core.warning(`createReview failed (${e.status || ''}): ${e.message}. Falling back to a plain comment.`);
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body: reviewBody
              });
            }

            // Add YOU as a reviewer so the PR lands in your review queue and you
            // are the one who approves (a github-actions[bot] review does NOT
            // count toward branch-protection approvals).
            //
            // THE KEY `if`: GitHub rejects requesting a review from the PR's own
            // author, so we only add you when you did NOT open the PR:
            //   - healing / bot PRs  -> author is github-actions[bot] -> you ARE added
            //   - your own manual PRs -> author is you -> skipped (comments only)
            const reviewerLogin = (process.env.PR_REVIEW_ASSIGNEE || context.repo.owner || '').trim();
            const prAuthor = (pr.user && pr.user.login) || '';
            if (reviewerLogin && prAuthor && reviewerLogin.toLowerCase() !== prAuthor.toLowerCase()) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner, repo, pull_number: prNumber,
                  reviewers: [reviewerLogin]
                });
                core.info(`✓ Added @${reviewerLogin} as a reviewer on PR #${prNumber}`);
              } catch (e) {
                core.warning(`Could not add @${reviewerLogin} as reviewer (${e.status || ''}): ${e.message}`);
              }
            } else {
              core.info(`Skipped adding a reviewer — you authored this PR (or no assignee set). Review comments were still posted.`);
            }
