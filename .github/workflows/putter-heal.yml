name: 🏥 Auto-Heal Build Errors

on:
  push:
    branches: [main, develop]

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: 📦 Install & Build
        continue-on-error: true
        run: |
          cd Frontend/lunchbox-app
          npm ci
          npm run build 2>&1 | tee build.log
      
      - name: 🤖 Run Putter if errors
        if: contains(fromJson('["error"]'), 'error')
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull codellama
          cd Frontend/lunchbox-app
          node ../../putter.js --auto || true
      
      - name: 📝 Create PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const changedFiles = execSync('git diff --name-only || true').toString();
            if (changedFiles.trim().length > 0) {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🏥 Auto-fixed build errors',
                head: context.ref,
                base: 'main',
                body: 'Automatic fix by Putter healing agent'
              });
              console.log('PR:', pr.data.html_url);
            }
