name: 🔍 Auto Issue Analysis

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours to catch any missed issues

jobs:
  analyze-all-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get all open issues
        id: get-issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            return issues.data;

      - name: Analyze and comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            // Skip if already has analysis comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const hasAnalysis = comments.data.some(c => 
              c.user.type === 'Bot' && c.body.includes('🔍 Issue Analysis')
            );
            
            if (hasAnalysis) {
              console.log('Analysis comment already exists, skipping...');
              return;
            }

            // Extract issue details
            const title = issue.title;
            const labels = issue.labels.map(l => l.name).join(', ') || 'unclassified';
            const isBug = issue.labels.some(l => l.name === 'bug');
            const createdAt = new Date(issue.created_at).toLocaleDateString();
            
            // Determine priority
            let priority = '🟡 Medium';
            let severity = 'Standard';
            if (isBug) {
              if (title.includes('CRITICAL') || title.includes('admin') || title.includes('login')) {
                priority = '🔴 CRITICAL';
                severity = 'Security/Blocking';
              } else if (title.includes('ERROR') || title.includes('Broken')) {
                priority = '🔴 High';
                severity = 'Major Issue';
              }
            }

            // Build analysis comment
            const analysisComment = `## 🔍 Issue Analysis

**Issue Classification:**
- **Type:** ${labels}
- **Priority:** ${priority}
- **Severity:** ${severity}
- **Reporter:** @${issue.user.login}
- **Created:** ${createdAt}

**Quick Summary:**
${title}

**Recommended Actions:**
- [ ] Assign to team member
- [ ] Add priority/severity label
- [ ] Check for duplicate issues
- [ ] Link related issues if applicable
- [ ] Set milestone and sprint

**Reporter Info:**
- **GitHub:** @${issue.user.login}
- **Profile:** ${issue.user.html_url}

---
*This analysis was automatically generated by the Issue Analysis workflow. Please review and take appropriate action.*`;

            // Post comment only if this is a newly created or reopened issue
            if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: analysisComment
              });
              
              console.log(`✅ Analysis comment posted for issue #${context.issue.number}`);
            }
