name: Auto Issue Analysis

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze and comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            if (!issue) {
              console.log('No issue found');
              return;
            }
            
            // Skip if already has analysis comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });
            
            const hasAnalysis = comments.data.some(c => 
              c.body.includes('Issue Analysis')
            );
            
            if (hasAnalysis) {
              console.log('Analysis comment already exists');
              return;
            }

            // Extract issue details
            const title = issue.title;
            const labels = issue.labels.map(l => l.name).join(', ') || 'unclassified';
            const isBug = issue.labels.some(l => l.name === 'bug');
            const createdAt = new Date(issue.created_at).toLocaleDateString();
            
            // Determine priority
            let priority = 'Medium';
            let severity = 'Standard';
            if (isBug) {
              if (title.includes('CRITICAL') || title.includes('admin') || title.includes('login')) {
                priority = 'CRITICAL';
                severity = 'Security/Blocking';
              } else if (title.includes('ERROR') || title.includes('Broken')) {
                priority = 'High';
                severity = 'Major Issue';
              }
            }

            // Build analysis comment
            const analysisComment = [
              '## Issue Analysis',
              '',
              '**Classification:**',
              `- Type: ${labels}`,
              `- Priority: ${priority}`,
              `- Severity: ${severity}`,
              `- Reporter: @${issue.user.login}`,
              `- Created: ${createdAt}`,
              '',
              '**Summary:**',
              `${title}`,
              '',
              '**Recommended Actions:**',
              '- [ ] Assign to team member',
              '- [ ] Add priority label',
              '- [ ] Check for duplicates',
              '- [ ] Link related issues',
              '- [ ] Set milestone',
              '',
              '**Reporter:**',
              `- GitHub: @${issue.user.login}`,
              `- Profile: ${issue.user.html_url}`,
              '',
              '---',
              '*Auto-generated issue analysis. Please review and take action.*'
            ].join('\n');

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: analysisComment
            });
            
            console.log('Analysis comment posted');
