name: Auto Issue Analysis

on:
  issues:
    types: [opened, edited, reopened, labeled]

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze and comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            if (!issue) {
              console.log('No issue found');
              return;
            }

            const labels = Array.isArray(issue.labels) ? issue.labels.map((label) => String(label.name || '').toLowerCase()) : [];

            // Skip if already has analysis comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });
            
            const hasAnalysis = comments.data.some(c => 
              c.body.includes('Issue Investigation Assistant') || c.body.includes('Bug Investigation Assistant') || c.body.includes('Issue Analysis')
            );
            
            if (hasAnalysis) {
              console.log('Analysis comment already exists');
              return;
            }

            const title = String(issue.title || '').trim();
            const body = String(issue.body || '').trim();
            const reporter = String(issue.user?.login || 'unknown');
            const createdAt = new Date(issue.created_at).toLocaleDateString();
            const labelsText = labels.length ? labels.join(', ') : 'unclassified';

            const lowerText = `${title}\n${body}`.toLowerCase();

            let likelyArea = 'General app flow';
            if (lowerText.includes('login') || lowerText.includes('auth') || lowerText.includes('otp') || lowerText.includes('token')) {
              likelyArea = 'Authentication';
            } else if (lowerText.includes('booking') || lowerText.includes('ride') || lowerText.includes('captain')) {
              likelyArea = 'Booking / Captain workflow';
            } else if (lowerText.includes('payment') || lowerText.includes('fare') || lowerText.includes('promo')) {
              likelyArea = 'Payments / Pricing';
            } else if (lowerText.includes('network') || lowerText.includes('fetch') || lowerText.includes('cors') || lowerText.includes('api')) {
              likelyArea = 'API / network integration';
            } else if (lowerText.includes('save') || lowerText.includes('refresh') || lowerText.includes('localstorage')) {
              likelyArea = 'State persistence / local storage';
            }

            const hasSteps = /steps to reproduce|repro steps|reproduction steps/i.test(body);
            const hasExpected = /expected/i.test(body);
            const hasActual = /actual|what happened/i.test(body);
            const hasEnv = /environment|browser|device|version/i.test(body);

            const missingInfo = [];
            if (!hasSteps) missingInfo.push('Steps to reproduce');
            if (!hasExpected) missingInfo.push('Expected result');
            if (!hasActual) missingInfo.push('Actual result');
            if (!hasEnv) missingInfo.push('Environment details');

            let severity = 'Medium';
            if (/crash|broken|cannot|unable|blocked|security|data loss/i.test(lowerText)) {
              severity = 'High';
            }
            if (/critical|production down|cannot login|payment failed/i.test(lowerText)) {
              severity = 'Critical';
            }

            let rootCause = 'The issue report does not include enough detail to confirm a single root cause yet.';
            let fixRecommendation = 'Reproduce the issue, inspect the failing request or component, and add a regression test before shipping the fix.';

            if (lowerText.includes('404') && lowerText.includes('login')) {
              rootCause = 'The login flow is likely calling a route or backend URL that does not exist in the deployed environment, so the request fails before authentication completes.';
              fixRecommendation = 'Verify the frontend login API base URL, confirm the backend route exists in the deployed service, and check any rewrite or proxy configuration that may be pointing to the wrong host.';
            } else if (lowerText.includes('404')) {
              rootCause = 'A route mismatch is likely: the UI is requesting an endpoint that is missing, renamed, or deployed in a different service.';
              fixRecommendation = 'Compare the requested URL against the backend route table, then fix the service path, deployment target, or client base URL.';
            } else if (lowerText.includes('auth') || lowerText.includes('otp') || lowerText.includes('token')) {
              rootCause = 'The authentication state or session handling is likely failing before the user reaches the protected screen.';
              fixRecommendation = 'Check token/session creation, authorization checks, and any guards that may reject the user before the login flow completes.';
            } else if (lowerText.includes('booking') || lowerText.includes('captain')) {
              rootCause = 'The booking/captain flow likely breaks because the client and backend are out of sync on state, permissions, or booking data shape.';
              fixRecommendation = 'Inspect the request payload, response mapping, and state persistence logic for the booking flow and patch the failing step directly.';
            }

            // Build developer-focused analysis comment
            const analysisComment = [
              '## Issue Investigation Assistant',
              '',
              '**Quick Triage:**',
              `- Type: ${labelsText}`,
              `- Severity: ${severity}`,
              `- Likely area: ${likelyArea}`,
              `- Reporter: @${reporter}`,
              `- Created: ${createdAt}`,
              '',
              '**Root cause hypothesis:**',
              rootCause,
              '',
              '**Suggested fix:**',
              fixRecommendation,
              '',
              '**Likely investigation path:**',
              `- Check the ${likelyArea} code path first.`,
              '- Compare the bug report against recent frontend and backend changes.',
              '- Reproduce the issue with the same role, route, and saved state used by the reporter.',
              '',
              '**What to verify first:**',
              '- API request and response in browser network tab',
              '- Console errors and failed validation messages',
              '- Authentication/session state if the issue affects protected screens',
              '- Local storage or persisted profile/booking state if the issue survives refresh',
              '',
              '**Missing information:**',
              ...(missingInfo.length ? missingInfo.map((item) => `- ${item}`) : ['- None; issue contains enough info to begin reproduction.']),
              '',
              '**Developer next steps:**',
              '- [ ] Reproduce the issue locally or in staging',
              '- [ ] Find the exact failing component, route, or API call',
              '- [ ] Add or update a regression test',
              '- [ ] Fix the root cause, not just the symptom',
              '- [ ] Confirm the fix with a fresh session and a persisted session',
              '',
              '**Summary from issue:**',
              title || 'No title provided',
              '',
              '---',
              '*Auto-generated bug investigation note. Use this as a starting point for root-cause analysis.*'
            ].join('\n');

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: analysisComment
            });
            
            console.log('Analysis comment posted');
