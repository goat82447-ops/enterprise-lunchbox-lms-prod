name: MCP+ PROXIMA 🚀 Healing Agent

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: open_router-healing-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  heal-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_BASE_URL: ${{ vars.OPENROUTER_API_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENROUTER_MODEL: 'openrouter/auto'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OPEN_ROUTER configuration
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Missing required secret: OPENROUTER_API_KEY" >&2
            exit 1
          fi
          if [ -z "${OPENROUTER_MODEL}" ]; then
            echo "Missing required variable: OPENROUTER_MODEL" >&2
            exit 1
          fi

      - name: Collect repository context via MCP + smart analysis
        id: collect_context
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: |
          CONTEXT_DIR="healing-reports"
          CONTEXT_FILE="${CONTEXT_DIR}/openrouter-context-${ISSUE_NUMBER}.txt"
          mkdir -p "$CONTEXT_DIR"
          
          # Collect MCP context with SMART issue analysis
          python3 << 'PYEOF'
          import json
          import subprocess
          import os
          import pathlib
          
          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")
          issue_number = os.environ.get("ISSUE_NUMBER", "")
          
          # Call MCP with smart issue:analyze
          mcp_requests = [
              {"method": "project:summary", "params": {}},
              {"method": "issue:analyze", "params": {"title": issue_title, "body": issue_body}},
              {"method": "healing:context", "params": {}}
          ]
          
          context = {}
          try:
              for req in mcp_requests:
                  try:
                      proc = subprocess.run(
                          ["node", "mcp-server/server.js"],
                          input=json.dumps(req),
                          text=True,
                          capture_output=True,
                          timeout=5
                      )
                      if proc.returncode == 0 and proc.stdout.strip():
                          resp = json.loads(proc.stdout.strip())
                          if resp.get("success"):
                              context[req["method"]] = resp.get("data", {})
                  except Exception as e:
                      print(f"Warning: Failed to collect {req['method']}: {e}")
          except Exception as e:
              print(f"Warning: MCP context collection failed: {e}")
          
          # USE SMART ANALYSIS RESULTS FROM MCP
          issue_analysis = context.get("issue:analyze", {})
          relevant_files = issue_analysis.get("relevantFiles", [])
          keywords = issue_analysis.get("keywords", [])
          phrases = issue_analysis.get("phrases", [])
          ranked_matches = issue_analysis.get("rankedMatches", [])
          confidence = issue_analysis.get("confidence", "unknown")
          file_contents = issue_analysis.get("fileContents", [])
          surface_hints = issue_analysis.get("surfaceHints", [])
          healing_context_files = context.get("healing:context", [])
          
          # Build context for model with smart file discovery
          parts = []
          parts.append("=== ISSUE SUMMARY ===")
          parts.append(issue_title)
          parts.append(issue_body)
          parts.append("")
          
          if keywords:
              parts.append(f"=== DETECTED KEYWORDS (Smart Analysis) ===")
              parts.extend(keywords[:20])
              parts.append("")

          if phrases:
              parts.append(f"=== DETECTED PHRASES (Smart Analysis) ===")
              parts.extend(phrases[:12])
              parts.append("")

          parts.append(f"=== MATCH CONFIDENCE ===")
          parts.append(confidence)
          parts.append("")

          if surface_hints:
              parts.append("=== SURFACE HINTS ===")
              parts.extend(surface_hints[:8])
              parts.append("")
          
          if relevant_files:
              parts.append(f"=== RELEVANT FILES ({len(relevant_files)} found) ===")
              parts.extend(relevant_files[:15])
              parts.append("")

          if ranked_matches:
              parts.append(f"=== TOP MATCH DETAILS ({len(ranked_matches)} ranked) ===")
              for match in ranked_matches[:8]:
                  parts.append(
                      f"- {match.get('path', '')} | score={match.get('score', 0)} | "
                      f"surface={match.get('surface', '')} | "
                      f"keywords={','.join(match.get('matchedKeywords', []))}"
                  )
              parts.append("")

          if healing_context_files:
              parts.append(f"=== HEALING CONTEXT FILES ({len(healing_context_files)} found) ===")
              parts.extend(healing_context_files[:20])
              parts.append("")
          
          # Add file contents from smart analysis
          if file_contents:
              parts.append("=== FILE CONTENTS (Most Relevant) ===")
              for fc in file_contents[:5]:
                  parts.append(f"FILE: {fc.get('path', '')}")
                  if fc.get("lineStart"):
                      parts.append(
                          f"LINES: {fc.get('lineStart', '')}-{fc.get('lineEnd', '')} | "
                          f"KEYWORDS: {','.join(fc.get('matchedKeywords', []))}"
                      )
                  parts.append(fc.get('content', '')[:3500])
                  parts.append("")
          
          # Add baseline files for context
          baseline_files = [
              ".github/copilot-instructions.md",
              "Frontend/lunchbox-app/src/app/app.routes.ts",
              "Frontend/lunchbox-app/package.json",
          ]
          
          for p in baseline_files:
              if pathlib.Path(p).exists():
                  try:
                      content = pathlib.Path(p).read_text(encoding="utf-8", errors="ignore")
                      snippet = "\n".join(content.splitlines()[:80])
                      parts.append(f"=== BASELINE: {p} ===")
                      parts.append(snippet)
                      parts.append("")
                  except Exception:
                      pass
          
          context_file = pathlib.Path(f"healing-reports/openrouter-context-{issue_number}.txt")
          context_file.write_text("\n".join(parts), encoding="utf-8")
          print(f"Wrote smart analysis context to {context_file}")
          PYEOF
          
          echo "context_file=$CONTEXT_FILE" >> "$GITHUB_OUTPUT"

      - name: Analyze issue and publish diagnostics
        id: analyze
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_CONTEXT_FILE: ${{ steps.collect_context.outputs.context_file }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!issueNumber) {
              core.info('No issue context available (workflow_dispatch without issue payload). Skipping.');
              return;
            }

            const fs = require('fs');
            const path = require('path');
            const baseUrl = process.env.OPENROUTER_API_BASE_URL;
            const model = process.env.OPENROUTER_MODEL;
            const apiKey = process.env.OPENROUTER_API_KEY;
            const contextFile = process.env.ISSUE_CONTEXT_FILE;
            let repoContext = '';
            if (contextFile && fs.existsSync(contextFile)) {
              repoContext = fs.readFileSync(contextFile, 'utf8');
            }

            const prompt = [
              `Issue title: ${process.env.ISSUE_TITLE}`,
              '',
              'Issue body:',
              `${process.env.ISSUE_BODY}`,
              '',
              'IMPORTANT INSTRUCTIONS:',
              '1. You are a code healing assistant. Your job is to FIX code issues.',
              '2. Use the repository context provided below to understand the project structure.',
              '3. Return markdown with these EXACT headings:',
              '   - ## Error Observed (what the user sees)',
              '   - ## Root Cause (why it happens)',
              '   - ## Resolution (how to fix it)',
              '   - ## Validation Steps (how to test)',
              '   - ## Proposed Patch (the actual code fix)',
              '',
              '4. Rules for "## Proposed Patch":',
              '   - If you can write a code fix based on the context, provide it as a fenced diff block.',
              '   - Diff must use valid git unified diff format (start with "diff --git", include ---/+++ headers and @@ hunks).',
              '   - Only modify EXISTING files (Frontend, Backend paths).',
              '   - Keep changes minimal and focused.',
              '   - If impossible to fix (insufficient evidence), write exactly "NO_PATCH" (nothing else).',
              '',
              '5. RULES FOR GENERATING PATCHES:',
              '   - For any actionable issue with sufficient evidence (frontend, backend, .NET, or config), GENERATE CODE',
              '   - DO NOT write NO_PATCH unless it is truly impossible',
              '   - Use the file contents below to understand current code structure',
              '   - Match existing code style (indentation, naming, patterns)',
              '',
              'Repository context (files/code snippets):',
              repoContext || 'No repository context available.',
              '',
              'Generate your response now. Remember: provide actual code changes, not explanations only.'
            ].join('\n');

            let content = '';
            let apiError = '';

            try {
              const response = await fetch(`${baseUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
                  'X-Title': `${process.env.GITHUB_REPOSITORY} OPEN_ROUTER Healing`
                },
                body: JSON.stringify({
                  model,
                  temperature: 0.2,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a software issue healing assistant for a production repository. Never invent facts. Provide exact root cause only when evidence is sufficient; otherwise explicitly mark insufficient evidence and request required logs.'
                    },
                    {
                      role: 'user',
                      content: prompt
                    }
                  ]
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                apiError = `OPEN_ROUTER API request failed (${response.status}): ${errorText.slice(0, 1000)}`;
              } else {
                const data = await response.json();
                content = data?.choices?.[0]?.message?.content?.trim() || '';
                if (!content) {
                  apiError = 'OPEN_ROUTER API returned no message content.';
                }
              }
            } catch (err) {
              apiError = `OPEN_ROUTER API request threw an exception: ${String(err).slice(0, 1000)}`;
            }

            const body = apiError
              ? [
                  `## MCP+ PROXIMA 🚀 Healing Agent (${model})`,
                  '',
                  '### Error Observed',
                  'OPEN_ROUTER analysis step failed before generating diagnostics.',
                  '',
                  '### Root Cause',
                  apiError,
                  '',
                  '### Resolution',
                  '1. Verify `OPENROUTER_API_KEY` repository secret is valid and active.',
                  '2. Verify OpenRouter account credits/quota and model access.',
                  '3. Re-run this workflow after updating key/model.',
                  '',
                  '> Automated fallback comment because model analysis failed.'
                ].join('\n')
              : [
                  `## MCP+ PROXIMA 🚀 Healing Agent (${model})`,
                  '',
                  content,
                  '',
                  '> Generated automatically from the current issue details.'
                ].join('\n');

            const reportDir = path.join(process.env.GITHUB_WORKSPACE, 'healing-reports');
            fs.mkdirSync(reportDir, { recursive: true });
            const reportPath = path.join(reportDir, `openrouter-issue-${issueNumber}.md`);
            const reportMarkdown = [
              `# MCP+ PROXIMA 🚀 Healing Report - Issue #${issueNumber}`,
              '',
              `**Issue:** ${process.env.ISSUE_TITLE}`,
              `**Model:** ${model}`,
              `**Generated at:** ${new Date().toISOString()}`,
              '',
              body
            ].join('\n');
            fs.writeFileSync(reportPath, reportMarkdown, 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            await core.summary
              .addHeading(`MCP+ PROXIMA 🚀 Healing Agent (${model})`)
              .addRaw(apiError ? '**Status:** Failed to analyze with OPEN_ROUTER' : '**Status:** Analysis posted successfully')
              .addEOL()
              .addEOL()
              .addRaw(apiError ? `**Error:** ${apiError}` : 'Issue comment posted with structured diagnostics.')
              .write();

            if (apiError) core.warning(apiError);
            core.setOutput('report_path', `healing-reports/openrouter-issue-${issueNumber}.md`);
            core.setOutput('analysis_status', apiError ? 'failed' : 'ok');

      - name: Apply OPEN_ROUTER patch if provided
        id: apply_patch
        shell: bash
        run: |
          REPORT_PATH="healing-reports/openrouter-issue-${{ github.event.issue.number }}.md"
          PATCH_FILE="openrouter.patch"

          if [ ! -f "$REPORT_PATH" ]; then
             echo "⚠️ No report file found at $REPORT_PATH"
             echo "patch_applied=false" >> "$GITHUB_OUTPUT"
             exit 0
           fi

           echo "📄 Found report at $REPORT_PATH"
           echo "---"
          
           # Extract and normalize patch content. Do not depend strictly on "## Proposed Patch".
           python3 - "$REPORT_PATH" "$PATCH_FILE" <<'PY'
import re
import sys

report_path, patch_path = sys.argv[1], sys.argv[2]
text = open(report_path, "r", encoding="utf-8", errors="ignore").read()
lowered = text.lower()

marker = lowered.find("## proposed patch")
scope = text[marker:] if marker >= 0 else text
if marker >= 0:
    print(f"✓ Found Proposed Patch section at position {marker}")
else:
    print("⚠️ Proposed Patch heading not found; scanning full report for diff")

def normalize_payload(payload):
    lines = []
    for raw in payload.replace("\r\n", "\n").replace("\r", "\n").split("\n"):
        line = raw
        if line.startswith("> "):
            line = line[2:]
        if line.startswith("    diff --git ") or line.startswith("\tdiff --git "):
            line = line.lstrip()
        lines.append(line)

    start = next((i for i, line in enumerate(lines) if line.startswith("diff --git ")), None)
    if start is None:
        return ""
    return "\n".join(lines[start:]).strip()

def extract_diff_from_text(source):
    # Prefer fenced code blocks that contain unified diff content.
    fenced_blocks = re.findall(r"```[^\n]*\n(.*?)\n```", source, flags=re.S)
    for block in fenced_blocks:
        if "diff --git " in block:
            return block

    # Fallback to raw text starting from first diff header.
    idx = source.find("diff --git ")
    if idx >= 0:
        return source[idx:]
    return ""

payload = extract_diff_from_text(scope)
if not payload and scope is not text:
    payload = extract_diff_from_text(text)

if not payload:
    meaningful = [line.strip() for line in scope.splitlines() if line.strip()]
    if any(line.upper() == "NO_PATCH" for line in meaningful):
        print("⚠️ Model returned NO_PATCH")
        open(patch_path, "w", encoding="utf-8").write("NO_PATCH\n")
        sys.exit(0)

    print("❌ ERROR: No diff block found in report")
    print(f"Report preview (first 800 chars):\n{text[:800]}")
    open(patch_path, "w", encoding="utf-8").write("")
    sys.exit(0)

normalized = normalize_payload(payload)
if not normalized:
    print("❌ ERROR: Found patch-like content, but no valid 'diff --git' header after normalization")
    print(f"Payload preview (first 500 chars):\n{payload[:500]}")
    open(patch_path, "w", encoding="utf-8").write("")
    sys.exit(0)

open(patch_path, "w", encoding="utf-8").write(normalized + "\n")
print(f"✓ Normalized patch: {len(normalized)} bytes")
first_line = normalized.splitlines()[0] if normalized else "EMPTY"
print("✓ First line:", first_line)
PY

           if [ ! -s "$PATCH_FILE" ]; then
             echo "❌ No patch block detected in report."
             echo "patch_applied=false" >> "$GITHUB_OUTPUT"
             exit 0
           fi

           if grep -q "^NO_PATCH$" "$PATCH_FILE"; then
             echo "⚠️ Model returned NO_PATCH - insufficient issue details for code generation"
             echo "patch_applied=false" >> "$GITHUB_OUTPUT"
             exit 0
           fi

           echo "---"
           echo "🔧 Attempting to apply patch..."
          
           if git apply --check --recount "$PATCH_FILE" 2>&1; then
             echo "✓ Patch validation passed"
             if git apply --index --recount "$PATCH_FILE" 2>&1; then
               echo "✓ Patch applied successfully"
               STAGED_FILES="$(git diff --cached --name-only)"
               echo ""
               echo "📝 Staged files:"
               echo "$STAGED_FILES"

               if [ -z "$STAGED_FILES" ]; then
                 echo "❌ No staged files after patch"
                 echo "patch_applied=false" >> "$GITHUB_OUTPUT"
                 exit 0
               fi

               # Only allow patches that touch repo source surfaces.
               if echo "$STAGED_FILES" | grep -E -v '^(Frontend|Backend)/' > /dev/null; then
                 echo "❌ Patch touches non-source paths; rejecting"
                 git reset
                 echo "patch_applied=false" >> "$GITHUB_OUTPUT"
                 exit 0
               fi

               # Require edits to existing files only (no newly created source files).
               while IFS= read -r f; do
                 if [ -n "$f" ] && ! git cat-file -e "HEAD:$f" 2>/dev/null; then
                   echo "❌ Patch created new file '$f'; rejecting"
                   git reset
                   echo "patch_applied=false" >> "$GITHUB_OUTPUT"
                   exit 0
                 fi
               done <<< "$STAGED_FILES"

               # Require at least one concrete code/config file under Frontend or Backend.
               if echo "$STAGED_FILES" | grep -E '^Frontend/.*\.(ts|tsx|js|jsx|html|scss|css|json)$|^Backend/.*\.(ts|tsx|js|jsx|json|cs|csproj|sln|props|targets|config)$' > /dev/null; then
                 echo "✓ Valid source file changes detected"
                 echo "patch_applied=true" >> "$GITHUB_OUTPUT"
               else
                 echo "❌ Patch does not include valid source file changes"
                 git reset
                 echo "patch_applied=false" >> "$GITHUB_OUTPUT"
               fi
             else
               echo "❌ git apply --index failed"
               echo "First 80 lines of patch:"
               head -80 "$PATCH_FILE"
               echo "patch_applied=false" >> "$GITHUB_OUTPUT"
             fi
           else
             echo "❌ git apply --check validation failed"
             echo "First 80 lines of patch for debugging:"
             head -80 "$PATCH_FILE"
             echo "patch_applied=false" >> "$GITHUB_OUTPUT"
           fi

      - name: Create or update healing PR
        if: ${{ steps.apply_patch.outputs.patch_applied == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: open_router-healing/issue-${{ github.event.issue.number }}
          title: MCP+ PROXIMA 🚀 code fix for issue #${{ github.event.issue.number }}
          body: |
            Automated MCP+ PROXIMA 🚀 generated code changes from issue details.

            Closes #${{ github.event.issue.number }}

            - Analysis status: `${{ steps.analyze.outputs.analysis_status }}`
            - Report file: `${{ steps.analyze.outputs.report_path }}`
            - Patch applied: `${{ steps.apply_patch.outputs.patch_applied || 'false' }}`
          commit-message: "fix(healing): apply OPEN_ROUTER patch for issue #${{ github.event.issue.number }}"
          add-paths: |
            Frontend/**
            Backend/**
            healing-reports/openrouter-issue-${{ github.event.issue.number }}.md
