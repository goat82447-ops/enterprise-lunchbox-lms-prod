name: MCP+ PROXIMA 🚀 Healing Agent

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: open_router-healing-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  heal-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_BASE_URL: ${{ vars.OPENROUTER_API_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENROUTER_MODEL: 'openrouter/auto'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Missing required secret: OPENROUTER_API_KEY" >&2
            exit 1
          fi

      - name: Collect repository context
        id: collect_context
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: |
          # Skip context collection when no issue payload (e.g. workflow_dispatch)
          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "⚠️ No issue number — skipping context collection"
            echo "context_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p healing-reports
          CONTEXT_FILE="healing-reports/openrouter-context-${ISSUE_NUMBER}.txt"

          {
            echo "=== ISSUE ==="
            echo "Title: ${ISSUE_TITLE}"
            echo ""
            printf '%s\n' "${ISSUE_BODY}"
            echo ""
          } > "$CONTEXT_FILE"

          # Extract meaningful keywords (|| true prevents pipefail on no matches)
          KEYWORDS=$(printf '%s %s' "${ISSUE_TITLE}" "${ISSUE_BODY}" \
            | tr '[:upper:]' '[:lower:]' \
            | grep -oE '[a-z][a-z0-9]{3,}' \
            | grep -vxE 'this|that|with|from|have|will|been|when|then|they|also|into|more|some|what|which|there|their|after|before|should|would|could|using|error|issue|problem|please|working|getting|cannot|doesnt|https|http|the|and|for|not|are|but|was|has|its' \
            | sort -u | head -20 || true)

          echo "=== KEYWORDS ===" >> "$CONTEXT_FILE"
          printf '%s\n' "$KEYWORDS" >> "$CONTEXT_FILE"
          echo "" >> "$CONTEXT_FILE"

          # Search for relevant files using keywords
          RELEVANT_FILES=""
          for kw in $KEYWORDS; do
            hits=$(grep -rl "$kw" Frontend/ Backend/ 2>/dev/null \
              | grep -E '\.(ts|html|scss|css|json|cs)$' | head -5 || true)
            RELEVANT_FILES="${RELEVANT_FILES}"$'\n'"${hits}"
          done

          # Sort files by match frequency — most-matched files first
          TOP_FILES=$(printf '%s\n' "$RELEVANT_FILES" \
            | grep -v '^[[:space:]]*$' \
            | sort | uniq -c | sort -rn \
            | awk '{print $2}' | head -8 || true)

          echo "=== RELEVANT FILES ===" >> "$CONTEXT_FILE"
          printf '%s\n' "$TOP_FILES" >> "$CONTEXT_FILE"
          echo "" >> "$CONTEXT_FILE"

          # Include content of top matched files
          echo "=== FILE CONTENTS ===" >> "$CONTEXT_FILE"
          while IFS= read -r f; do
            { [ -z "$f" ] || [ ! -f "$f" ]; } && continue
            echo "--- FILE: $f ---" >> "$CONTEXT_FILE"
            head -120 "$f" >> "$CONTEXT_FILE"
            echo "" >> "$CONTEXT_FILE"
          done <<< "$TOP_FILES"

          # Always include these baseline files
          for baseline in \
            "Frontend/lunchbox-app/src/app/app.routes.ts" \
            "Frontend/lunchbox-app/src/app/app.config.ts" \
            "Frontend/lunchbox-app/src/app/app.ts" \
            "Frontend/lunchbox-app/package.json" \
            ".github/copilot-instructions.md"; do
            [ -f "$baseline" ] || continue
            echo "--- BASELINE: $baseline ---" >> "$CONTEXT_FILE"
            head -80 "$baseline" >> "$CONTEXT_FILE"
            echo "" >> "$CONTEXT_FILE"
          done

          echo "context_file=$CONTEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "✓ Context written: $(wc -l < "$CONTEXT_FILE") lines"

      - name: Analyze issue and generate patch
        id: analyze
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_CONTEXT_FILE: ${{ steps.collect_context.outputs.context_file }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!issueNumber) {
              core.info('No issue number (workflow_dispatch without issue payload). Skipping.');
              return;
            }

            const fs = require('fs');
            const path = require('path');
            const baseUrl = process.env.OPENROUTER_API_BASE_URL;
            const model = process.env.OPENROUTER_MODEL;
            const apiKey = process.env.OPENROUTER_API_KEY;

            let repoContext = '';
            const ctxFile = process.env.ISSUE_CONTEXT_FILE;
            if (ctxFile && fs.existsSync(ctxFile)) {
              repoContext = fs.readFileSync(ctxFile, 'utf8').slice(0, 12000);
            }

            const prompt = [
              `Issue title: ${process.env.ISSUE_TITLE}`,
              '',
              'Issue body:',
              process.env.ISSUE_BODY,
              '',
              'TASK: Analyze this issue and produce a working code fix as a git patch.',
              '',
              'Return EXACTLY these sections in order:',
              '## Error Observed',
              '## Root Cause',
              '## Resolution',
              '## Validation Steps',
              '## Proposed Patch',
              '',
              'PATCH RULES — read carefully:',
              '- The patch MUST be inside a ```diff fenced block.',
              '- Must be valid git unified diff format.',
              '- Line 1: diff --git a/<path> b/<path>',
              '- Line 2: --- a/<path>',
              '- Line 3: +++ b/<path>',
              '- Line 4+: @@ hunk headers, then context lines (space prefix), deletions (- prefix), additions (+ prefix).',
              '- Only modify EXISTING files whose paths start with Frontend/ or Backend/.',
              '- Use the exact file paths shown in the repository context below.',
              '- If no patch can be produced from the evidence, write exactly: NO_PATCH',
              '',
              'EXAMPLE of correct format:',
              '```diff',
              'diff --git a/Frontend/lunchbox-app/src/app/app.component.ts b/Frontend/lunchbox-app/src/app/app.component.ts',
              '--- a/Frontend/lunchbox-app/src/app/app.component.ts',
              '+++ b/Frontend/lunchbox-app/src/app/app.component.ts',
              '@@ -10,6 +10,6 @@ export class AppComponent {',
              "   title = 'lunchbox-app';",
              '-  showNav = false;',
              '+  showNav = true;',
              ' }',
              '```',
              '',
              'Repository context (use these exact file paths in your patch):',
              repoContext || 'No repository context available.',
              '',
              'Generate your response now.'
            ].join('\n');

            let content = '';
            let apiError = '';

            try {
              const response = await fetch(`${baseUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
                  'X-Title': `${process.env.GITHUB_REPOSITORY} Healing`
                },
                body: JSON.stringify({
                  model,
                  temperature: 0.1,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a code healing assistant. When you produce a patch it must be a syntactically valid git unified diff that applies cleanly with "git apply". Never invent file paths — only use paths from the repository context provided.'
                    },
                    { role: 'user', content: prompt }
                  ]
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                apiError = `API request failed (${response.status}): ${errorText.slice(0, 800)}`;
              } else {
                const data = await response.json();
                content = data?.choices?.[0]?.message?.content?.trim() || '';
                if (!content) apiError = 'API returned no content.';
              }
            } catch (err) {
              apiError = `API exception: ${String(err).slice(0, 800)}`;
            }

            const body = apiError
              ? [
                  `## MCP+ PROXIMA 🚀 Healing Agent (${model})`,
                  '',
                  '### Error',
                  apiError,
                  '',
                  '> Verify `OPENROUTER_API_KEY` secret and account credits.'
                ].join('\n')
              : [
                  `## MCP+ PROXIMA 🚀 Healing Agent (${model})`,
                  '',
                  content,
                  '',
                  '> Generated automatically from the current issue details.'
                ].join('\n');

            const reportDir = path.join(process.env.GITHUB_WORKSPACE, 'healing-reports');
            fs.mkdirSync(reportDir, { recursive: true });
            const reportPath = path.join(reportDir, `openrouter-issue-${issueNumber}.md`);
            fs.writeFileSync(reportPath, [
              `# MCP+ PROXIMA 🚀 Healing Report - Issue #${issueNumber}`,
              '',
              `**Issue:** ${process.env.ISSUE_TITLE}`,
              `**Model:** ${model}`,
              `**Generated at:** ${new Date().toISOString()}`,
              '',
              body
            ].join('\n'), 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            if (apiError) core.warning(apiError);
            core.setOutput('report_path', `healing-reports/openrouter-issue-${issueNumber}.md`);
            core.setOutput('analysis_status', apiError ? 'failed' : 'ok');

      - name: Extract and apply patch
        id: apply_patch
        shell: bash
        run: |
          REPORT_PATH="healing-reports/openrouter-issue-${{ github.event.issue.number }}.md"
          PATCH_FILE="openrouter.patch"

          if [ ! -f "$REPORT_PATH" ]; then
            echo "⚠️ No report file found at $REPORT_PATH"
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "📄 Found report at $REPORT_PATH"

          # Extract diff from fenced ```diff block (no Python dependency)
          awk '
            /^```/ {
              if (!infence) { infence=1; next }
              if (hasdiff) { exit }
              infence=0; hasdiff=0; next
            }
            infence && /^diff --git / { hasdiff=1 }
            infence && hasdiff { print }
          ' "$REPORT_PATH" > "$PATCH_FILE"

          # Fallback: raw diff block not inside a fence
          if [ ! -s "$PATCH_FILE" ]; then
            awk '/^diff --git /{found=1} found{print}' "$REPORT_PATH" > "$PATCH_FILE"
          fi

          # Handle empty or NO_PATCH result
          if [ ! -s "$PATCH_FILE" ]; then
            if grep -q "NO_PATCH" "$REPORT_PATH"; then
              echo "⚠️ Model returned NO_PATCH"
            else
              echo "❌ No diff block found in report"
            fi
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q "^NO_PATCH" "$PATCH_FILE"; then
            echo "⚠️ Model returned NO_PATCH — insufficient issue details for a patch"
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🔧 Attempting to apply patch..."

          if git apply --check --recount "$PATCH_FILE" 2>&1; then
            echo "✓ Patch validation passed"
            git apply --index --recount "$PATCH_FILE"
            STAGED_FILES="$(git diff --cached --name-only)"

            if [ -z "$STAGED_FILES" ]; then
              echo "❌ No staged files after patch"
              echo "patch_applied=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "📝 Staged files:"
            echo "$STAGED_FILES"

            # Reject if any staged file is outside Frontend/ or Backend/
            BAD_FILES=$(echo "$STAGED_FILES" | grep -Ev '^(Frontend|Backend)/')
            if [ -n "$BAD_FILES" ]; then
              echo "❌ Patch touches paths outside Frontend/ or Backend/: $BAD_FILES"
              git reset
              echo "patch_applied=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Reject patches that create new files (only edits to existing files allowed)
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if ! git cat-file -e "HEAD:$f" 2>/dev/null; then
                echo "❌ Patch creates new file '$f'; rejecting"
                git reset
                echo "patch_applied=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done <<< "$STAGED_FILES"

            # Require at least one real source file
            if echo "$STAGED_FILES" | grep -qE '\.(ts|tsx|js|jsx|html|scss|css|json|cs|csproj)$'; then
              echo "✓ Valid source changes — raising PR"
              echo "patch_applied=true" >> "$GITHUB_OUTPUT"
            else
              echo "❌ Patch contains no source code files"
              git reset
              echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "❌ git apply --check failed"
            echo "--- Patch preview ---"
            head -80 "$PATCH_FILE"
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create healing PR
        if: ${{ steps.apply_patch.outputs.patch_applied == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: open_router-healing/issue-${{ github.event.issue.number }}
          title: "fix: healing patch for issue #${{ github.event.issue.number }}"
          body: |
            Automated code fix generated by MCP+ PROXIMA 🚀 Healing Agent.

            Closes #${{ github.event.issue.number }}

            - Analysis status: `${{ steps.analyze.outputs.analysis_status }}`
            - Report: `${{ steps.analyze.outputs.report_path }}`
          commit-message: "fix(healing): apply patch for issue #${{ github.event.issue.number }}"
          add-paths: |
            Frontend/**
            Backend/**
            healing-reports/openrouter-issue-${{ github.event.issue.number }}.md
