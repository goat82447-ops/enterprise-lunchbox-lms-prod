name: MCP+ PROXIMA 🚀 Healing Agent

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: open_router-healing-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  heal-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_BASE_URL: ${{ vars.OPENROUTER_API_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENROUTER_MODEL: 'openrouter/auto'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Missing required secret: OPENROUTER_API_KEY" >&2
            exit 1
          fi

      - name: Collect repository context
        id: collect_context
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: |
          # Skip context collection when no issue payload (e.g. workflow_dispatch)
          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "⚠️ No issue number — skipping context collection"
            echo "context_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p healing-reports
          CONTEXT_FILE="healing-reports/openrouter-context-${ISSUE_NUMBER}.txt"

          {
            echo "=== ISSUE ==="
            echo "Title: ${ISSUE_TITLE}"
            echo ""
            printf '%s\n' "${ISSUE_BODY}"
            echo ""
          } > "$CONTEXT_FILE"

          # Extract meaningful keywords (|| true prevents pipefail on no matches)
          KEYWORDS=$(printf '%s %s' "${ISSUE_TITLE}" "${ISSUE_BODY}" \
            | tr '[:upper:]' '[:lower:]' \
            | grep -oE '[a-z][a-z0-9]{3,}' \
            | grep -vxE 'this|that|with|from|have|will|been|when|then|they|also|into|more|some|what|which|there|their|after|before|should|would|could|using|error|issue|problem|please|working|getting|cannot|doesnt|https|http|the|and|for|not|are|but|was|has|its' \
            | sort -u | head -20 || true)

          echo "=== KEYWORDS ===" >> "$CONTEXT_FILE"
          printf '%s\n' "$KEYWORDS" >> "$CONTEXT_FILE"
          echo "" >> "$CONTEXT_FILE"

          # Search for relevant files using keywords (src only — skip node_modules/dist)
          RELEVANT_FILES=""
          for kw in $KEYWORDS; do
            hits=$(grep -rl "$kw" \
              --include="*.ts" --include="*.html" --include="*.scss" \
              --include="*.css" --include="*.json" --include="*.cs" \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              Frontend/lunchbox-app/src/ Backend/src/ 2>/dev/null \
              | head -5 || true)
            RELEVANT_FILES="${RELEVANT_FILES}"$'\n'"${hits}"
          done

          # Sort files by match frequency — most-matched files first
          TOP_FILES=$(printf '%s\n' "$RELEVANT_FILES" \
            | grep -v '^[[:space:]]*$' \
            | sort | uniq -c | sort -rn \
            | awk '{print $2}' | head -8 || true)

          echo "=== RELEVANT FILES ===" >> "$CONTEXT_FILE"
          printf '%s\n' "$TOP_FILES" >> "$CONTEXT_FILE"
          echo "" >> "$CONTEXT_FILE"

          # Include FULL content of top matched files (no truncation) so the
          # model copies real lines instead of guessing unseen code.
          echo "=== FILE CONTENTS ===" >> "$CONTEXT_FILE"
          while IFS= read -r f; do
            { [ -z "$f" ] || [ ! -f "$f" ]; } && continue
            echo "--- FILE: $f ---" >> "$CONTEXT_FILE"
            cat "$f" >> "$CONTEXT_FILE"
            echo "" >> "$CONTEXT_FILE"
          done <<< "$TOP_FILES"

          # Write exact file tree so AI uses correct paths (not guessed ones)
          echo "=== EXACT FILE TREE (use ONLY these paths in patches) ===" >> "$CONTEXT_FILE"
          find Frontend/lunchbox-app/src Backend/src \
            -not \( -path "*/node_modules/*" -o -path "*/dist/*" \) \
            -type f \( -name "*.ts" -o -name "*.html" -o -name "*.scss" -o -name "*.css" -o -name "*.json" -o -name "*.cs" \) \
            2>/dev/null | sort | head -60 >> "$CONTEXT_FILE" || true
          echo "" >> "$CONTEXT_FILE"

          # Always include these baseline files (FULL content)
          for baseline in \
            "Frontend/lunchbox-app/src/app/app.routes.ts" \
            "Frontend/lunchbox-app/src/app/app.config.ts" \
            "Frontend/lunchbox-app/src/app/app.ts" \
            "Frontend/lunchbox-app/src/app/app.html" \
            "Frontend/lunchbox-app/package.json" \
            ".github/copilot-instructions.md"; do
            [ -f "$baseline" ] || continue
            echo "--- BASELINE: $baseline ---" >> "$CONTEXT_FILE"
            cat "$baseline" >> "$CONTEXT_FILE"
            echo "" >> "$CONTEXT_FILE"
          done

          echo "context_file=$CONTEXT_FILE" >> "$GITHUB_OUTPUT"
          echo "✓ Context written: $(wc -l < "$CONTEXT_FILE") lines"

      - name: Analyze issue and generate patch
        id: analyze
        uses: actions/github-script@v8
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_CONTEXT_FILE: ${{ steps.collect_context.outputs.context_file }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!issueNumber) {
              core.info('No issue number (workflow_dispatch without issue payload). Skipping.');
              return;
            }

            const fs = require('fs');
            const path = require('path');
            const baseUrl = process.env.OPENROUTER_API_BASE_URL;
            const model = process.env.OPENROUTER_MODEL;
            const apiKey = process.env.OPENROUTER_API_KEY;

            let repoContext = '';
            const ctxFile = process.env.ISSUE_CONTEXT_FILE;
            if (ctxFile && fs.existsSync(ctxFile)) {
              repoContext = fs.readFileSync(ctxFile, 'utf8').slice(0, 180000);
            }

            const prompt = [
              `Issue title: ${process.env.ISSUE_TITLE}`,
              '',
              'Issue body:',
              process.env.ISSUE_BODY,
              '',
              'TASK: Analyze this issue and fix the code.',
              '',
              'Return EXACTLY these sections:',
              '## Error Observed',
              '## Root Cause',
              '## Resolution',
              '## Validation Steps',
              '## Proposed Patch',
              '',
              '── FORMAT FOR ## Proposed Patch ──',
              'Use this search/replace block (NOT git diff):',
              '',
              'FILE: <exact path from EXACT FILE TREE below>',
              '<<<SEARCH',
              '<copy the exact lines from the file that need to change>',
              '>>>REPLACE',
              '<the new lines to put in their place>',
              '>>>END',
              '',
              'RULES:',
              '- FILE path must exactly match a path in the EXACT FILE TREE section. Do NOT invent names like "app.component.html" — this project uses Angular standalone naming (app.ts, app.html).',
              '- <<<SEARCH must be COPIED CHARACTER-FOR-CHARACTER from the FILE CONTENTS shown below. Do not retype from memory, do not fix indentation, do not paraphrase.',
              '- Copy enough lines to be unique (3-10 lines), do not copy the whole file.',
              '- Only modify EXISTING files under Frontend/ or Backend/ that appear in the EXACT FILE TREE.',
              '- If the file you need is not shown in the FILE CONTENTS section, write exactly: NO_PATCH',
              '- If you cannot produce a fix, write exactly: NO_PATCH',
              '',
              'EXAMPLE:',
              'FILE: Frontend/lunchbox-app/src/app/app.ts',
              '<<<SEARCH',
              '  toggleNav() {',
              '    this.isNavOpen = !this.isNavOpen;',
              '  }',
              '>>>REPLACE',
              '  toggleNav() {',
              '    this.isNavOpen = !this.isNavOpen;',
              '  }',
              '',
              '  closeNav() {',
              '    this.isNavOpen = false;',
              '  }',
              '>>>END',
              '',
              'Repository context — EXACT FILE TREE and file contents:',
              repoContext || 'No repository context available.',
              '',
              'Generate your response now.'
            ].join('\n');

            let content = '';
            let apiError = '';

            try {
              const response = await fetch(`${baseUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
                  'X-Title': `${process.env.GITHUB_REPOSITORY} Healing`
                },
                body: JSON.stringify({
                  model,
                  temperature: 0.1,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a code healing assistant. When you produce a patch it must be a syntactically valid git unified diff that applies cleanly with "git apply". Never invent file paths — only use paths from the repository context provided.'
                    },
                    { role: 'user', content: prompt }
                  ]
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                apiError = `API request failed (${response.status}): ${errorText.slice(0, 800)}`;
              } else {
                const data = await response.json();
                content = data?.choices?.[0]?.message?.content?.trim() || '';
                if (!content) apiError = 'API returned no content.';
              }
            } catch (err) {
              apiError = `API exception: ${String(err).slice(0, 800)}`;
            }

            const body = apiError
              ? [
                  `## MCP+ PROXIMA 🚀 Healing Agent (${model})`,
                  '',
                  '### Error',
                  apiError,
                  '',
                  '> Verify `OPENROUTER_API_KEY` secret and account credits.'
                ].join('\n')
              : [
                  `## MCP+ PROXIMA 🚀 Healing Agent (${model})`,
                  '',
                  content,
                  '',
                  '> Generated automatically from the current issue details.'
                ].join('\n');

            const reportDir = path.join(process.env.GITHUB_WORKSPACE, 'healing-reports');
            fs.mkdirSync(reportDir, { recursive: true });
            const reportPath = path.join(reportDir, `openrouter-issue-${issueNumber}.md`);
            fs.writeFileSync(reportPath, [
              `# MCP+ PROXIMA 🚀 Healing Report - Issue #${issueNumber}`,
              '',
              `**Issue:** ${process.env.ISSUE_TITLE}`,
              `**Model:** ${model}`,
              `**Generated at:** ${new Date().toISOString()}`,
              '',
              body
            ].join('\n'), 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            if (apiError) core.warning(apiError);
            core.setOutput('report_path', `healing-reports/openrouter-issue-${issueNumber}.md`);
            core.setOutput('analysis_status', apiError ? 'failed' : 'ok');

      - name: Extract and apply patch
        id: apply_patch
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs   = require('fs');
            const { execSync } = require('child_process');

            const issueNumber = process.env.ISSUE_NUMBER;
            const reportPath  = `healing-reports/openrouter-issue-${issueNumber}.md`;

            if (!fs.existsSync(reportPath)) {
              core.info('⚠️ No report file found');
              core.setOutput('patch_applied', 'false');
              return;
            }
            core.info(`📄 Found report at ${reportPath}`);

            const report  = fs.readFileSync(reportPath, 'utf8');
            const lower   = report.toLowerCase();
            const idx     = lower.indexOf('## proposed patch');
            const section = idx >= 0 ? report.slice(idx) : report;

            if (/\bNO_PATCH\b/.test(section.slice(0, 300))) {
              core.info('⚠️ Model returned NO_PATCH');
              core.setOutput('patch_applied', 'false');
              return;
            }

            // Parse FILE / <<<SEARCH ... >>>REPLACE ... >>>END blocks
            const re = /FILE:\s*([^\n]+)\n<<<SEARCH\n([\s\S]*?)>>>REPLACE\n([\s\S]*?)>>>END/g;
            let match;
            const changed = [];
            const failures = [];

            const norm = (s) => s.replace(/\r\n/g, '\n');

            // Resolve a model-provided path to a real file. If the exact path
            // does not exist, try to find a unique file with the same basename
            // under Frontend/ or Backend/ (handles minor path guesses).
            function resolvePath(p) {
              if (fs.existsSync(p)) return p;
              const base = p.split('/').pop();
              try {
                const out = execSync('git ls-files Frontend Backend', { encoding: 'utf8' })
                  .split('\n').map((s) => s.trim()).filter(Boolean)
                  .filter((f) => f.split('/').pop() === base);
                if (out.length === 1) {
                  core.info(`↪ Resolved ${p} → ${out[0]}`);
                  return out[0];
                }
              } catch (e) { /* ignore */ }
              return null;
            }

            // Whitespace-tolerant fallback: find a contiguous run of lines in the
            // file whose trimmed text equals the trimmed SEARCH lines, then splice.
            function applyLineTrimmed(content, search, replace) {
              const fileLines = content.split('\n');
              let searchLines = search.split('\n');
              // Drop trailing empty line produced by the block's final newline
              if (searchLines.length && searchLines[searchLines.length - 1] === '') {
                searchLines = searchLines.slice(0, -1);
              }
              if (searchLines.length === 0) return null;

              const trim = (s) => s.replace(/\s+/g, ' ').trim();
              const target = searchLines.map(trim);

              for (let i = 0; i + target.length <= fileLines.length; i++) {
                let hit = true;
                for (let j = 0; j < target.length; j++) {
                  if (trim(fileLines[i + j]) !== target[j]) { hit = false; break; }
                }
                if (hit) {
                  let replLines = replace.split('\n');
                  if (replLines.length && replLines[replLines.length - 1] === '') {
                    replLines = replLines.slice(0, -1);
                  }
                  const merged = fileLines.slice(0, i)
                    .concat(replLines)
                    .concat(fileLines.slice(i + target.length));
                  return merged.join('\n');
                }
              }
              return null;
            }

            while ((match = re.exec(section)) !== null) {
              const rawPath  = match[1].trim();
              const search   = match[2];
              const replace  = match[3];

              if (!/^(Frontend|Backend)\//.test(rawPath)) {
                core.warning(`Skipping path outside source dirs: ${rawPath}`);
                failures.push(`\`${rawPath}\` — outside Frontend/ or Backend/`);
                continue;
              }
              const filepath = resolvePath(rawPath);
              if (!filepath) {
                core.warning(`File not found: ${rawPath}`);
                failures.push(`\`${rawPath}\` — file does not exist (no unique basename match)`);
                continue;
              }

              const raw = norm(fs.readFileSync(filepath, 'utf8'));
              let newContent = null;

              // 1) Exact match (after CRLF normalisation)
              if (raw.includes(norm(search))) {
                newContent = raw.replace(norm(search), norm(replace));
              } else {
                // 2) Whitespace-tolerant line-trimmed fallback
                newContent = applyLineTrimmed(raw, norm(search), norm(replace));
              }

              if (newContent === null) {
                core.warning(`Search text not found in ${filepath}`);
                failures.push(`\`${filepath}\` — SEARCH block did not match the current file content`);
                continue;
              }

              fs.writeFileSync(filepath, newContent, 'utf8');
              execSync(`git add "${filepath}"`);
              core.info(`✓ Patched and staged: ${filepath}`);
              changed.push(filepath);
            }

            if (changed.length === 0) {
              core.info('❌ No files were modified');
              core.setOutput('patch_applied', 'false');

              // Leave visible feedback on the issue instead of failing silently
              if (issueNumber && failures.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(issueNumber),
                  body: [
                    '### ⚠️ Healing Agent could not apply an automatic patch',
                    '',
                    'The generated SEARCH/REPLACE block did not match the repository, so no PR was created:',
                    '',
                    ...failures.map((f) => `- ${f}`),
                    '',
                    'This usually means the model guessed lines that differ from the real file ' +
                    '(indentation, paraphrased code, or a section that was not included in its context). ' +
                    'Re-run the workflow or refine the issue with the exact code snippet to change.'
                  ].join('\n')
                });
              }
              return;
            }

            core.info(`Changed: ${changed.join(', ')}`);
            core.setOutput('patch_applied', 'true');

      - name: Create healing PR
        if: ${{ steps.apply_patch.outputs.patch_applied == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: open_router-healing/issue-${{ github.event.issue.number }}
          title: "fix: healing patch for issue #${{ github.event.issue.number }}"
          body: |
            Automated code fix generated by MCP+ PROXIMA 🚀 Healing Agent.

            Closes #${{ github.event.issue.number }}

            - Analysis status: `${{ steps.analyze.outputs.analysis_status }}`
            - Report: `${{ steps.analyze.outputs.report_path }}`
          commit-message: "fix(healing): apply patch for issue #${{ github.event.issue.number }}"
          add-paths: |
            Frontend/**
            Backend/**
            healing-reports/openrouter-issue-${{ github.event.issue.number }}.md
