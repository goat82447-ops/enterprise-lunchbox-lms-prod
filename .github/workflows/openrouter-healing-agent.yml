name: PROXIMA 🚀 Healing Agent

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: open_router-healing-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  heal-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENROUTER_API_BASE_URL: ${{ vars.OPENROUTER_API_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OPENROUTER_MODEL: 'openrouter/auto'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OPEN_ROUTER configuration
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "Missing required secret: OPENROUTER_API_KEY" >&2
            exit 1
          fi
          if [ -z "${OPENROUTER_MODEL}" ]; then
            echo "Missing required variable: OPENROUTER_MODEL" >&2
            exit 1
          fi

      - name: Collect repository context for issue
        id: collect_context
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: |
          CONTEXT_DIR="healing-reports"
          CONTEXT_FILE="${CONTEXT_DIR}/openrouter-context-${ISSUE_NUMBER}.txt"
          mkdir -p "$CONTEXT_DIR"
          python - <<'PY'
          import os, re, subprocess, pathlib

          issue_title = os.environ.get("ISSUE_TITLE", "")
          issue_body = os.environ.get("ISSUE_BODY", "")
          issue_number = os.environ.get("ISSUE_NUMBER", "")
          context_file = pathlib.Path(f"healing-reports/openrouter-context-{issue_number}.txt")
          context_file.parent.mkdir(parents=True, exist_ok=True)

          text = f"{issue_title}\n{issue_body}".lower()
          stop = {"with","that","this","from","have","will","when","what","where","there","error","issue","failed","login","user","please","getting","while"}
          words = [w for w in re.findall(r"[a-z0-9_]{4,}", text) if w not in stop]
          keywords = []
          for w in words:
              if w not in keywords:
                  keywords.append(w)
              if len(keywords) >= 10:
                  break

          candidates = []
          for kw in keywords:
              try:
                  out = subprocess.check_output(
                      ["rg", "-l", kw, "Frontend/lunchbox-app/src", "Backend/microservices", "Backend/dotnet", "--glob", "!**/node_modules/**"],
                      text=True,
                      stderr=subprocess.DEVNULL
                  )
                  for p in out.splitlines():
                      if p and p not in candidates:
                          candidates.append(p)
                      if len(candidates) >= 12:
                          break
              except Exception:
                  pass
              if len(candidates) >= 12:
                  break

          # fallback for empty matches
          if not candidates:
              defaults = [
                  "Frontend/lunchbox-app/src/app/core/services/auth.service.ts",
                  "Frontend/lunchbox-app/src/app/features/login/login.component.ts",
                  "Frontend/lunchbox-app/src/environments/environment.prod.ts",
                  "Backend/dotnet/AuthService/Program.cs",
              ]
              candidates = [p for p in defaults if pathlib.Path(p).exists()]

          parts = []
          parts.append("=== ISSUE SUMMARY ===")
          parts.append(issue_title)
          parts.append(issue_body)
          parts.append("")
          parts.append("=== CANDIDATE FILES ===")
          parts.extend(candidates)
          parts.append("")

          max_total = 45000
          total = 0
          for p in candidates:
              path = pathlib.Path(p)
              if not path.exists():
                  continue
              try:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              snippet = "\n".join(content.splitlines()[:220])
              block = f"=== FILE: {p} ===\n{snippet}\n\n"
              if total + len(block) > max_total:
                  break
              parts.append(block)
              total += len(block)

          context_file.write_text("\n".join(parts), encoding="utf-8")
          print(f"Wrote context to {context_file}")
          PY
          echo "context_file=$CONTEXT_FILE" >> "$GITHUB_OUTPUT"

      - name: Analyze issue and publish diagnostics
        id: analyze
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          ISSUE_CONTEXT_FILE: ${{ steps.collect_context.outputs.context_file }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!issueNumber) {
              core.info('No issue context available (workflow_dispatch without issue payload). Skipping.');
              return;
            }

            const fs = require('fs');
            const path = require('path');
            const baseUrl = process.env.OPENROUTER_API_BASE_URL;
            const model = process.env.OPENROUTER_MODEL;
            const apiKey = process.env.OPENROUTER_API_KEY;
            const contextFile = process.env.ISSUE_CONTEXT_FILE;
            let repoContext = '';
            if (contextFile && fs.existsSync(contextFile)) {
              repoContext = fs.readFileSync(contextFile, 'utf8');
            }

            const prompt = [
              `Issue title: ${process.env.ISSUE_TITLE}`,
              '',
              'Issue body:',
              `${process.env.ISSUE_BODY}`,
              '',
              'Return markdown with these exact headings:',
              '## Error Observed',
              '## Root Cause',
              '## Resolution',
              '## Validation Steps',
              '## Proposed Patch',
              '',
              'Rules:',
              '- Use only evidence from the issue text/logs.',
              '- Do not guess.',
              '- If exact root cause is not provable from provided details, write "Insufficient evidence for exact root cause" and list exactly what logs/steps are missing.',
              '- In Resolution, provide only actions tied to observed evidence.',
              '- Keep response concise and actionable.',
              '- Under "## Proposed Patch", provide a single fenced diff block using ```diff ... ``` for real code changes when confident.',
              '- If no safe code change can be made, put exactly "NO_PATCH" under "## Proposed Patch".',
              '',
              'Repository context (files/snippets):',
              repoContext || 'No repository context available.'
            ].join('\n');

            let content = '';
            let apiError = '';

            try {
              const response = await fetch(`${baseUrl}/chat/completions`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`,
                  'X-Title': `${process.env.GITHUB_REPOSITORY} OPEN_ROUTER Healing`
                },
                body: JSON.stringify({
                  model,
                  temperature: 0.2,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a software issue healing assistant for a production repository. Never invent facts. Provide exact root cause only when evidence is sufficient; otherwise explicitly mark insufficient evidence and request required logs.'
                    },
                    {
                      role: 'user',
                      content: prompt
                    }
                  ]
                })
              });

              if (!response.ok) {
                const errorText = await response.text();
                apiError = `OPEN_ROUTER API request failed (${response.status}): ${errorText.slice(0, 1000)}`;
              } else {
                const data = await response.json();
                content = data?.choices?.[0]?.message?.content?.trim() || '';
                if (!content) {
                  apiError = 'OPEN_ROUTER API returned no message content.';
                }
              }
            } catch (err) {
              apiError = `OPEN_ROUTER API request threw an exception: ${String(err).slice(0, 1000)}`;
            }

            const body = apiError
              ? [
                  `## OPEN_ROUTER Healing Agent (${model})`,
                  '',
                  '### Error Observed',
                  'OPEN_ROUTER analysis step failed before generating diagnostics.',
                  '',
                  '### Root Cause',
                  apiError,
                  '',
                  '### Resolution',
                  '1. Verify `OPENROUTER_API_KEY` repository secret is valid and active.',
                  '2. Verify OpenRouter account credits/quota and model access.',
                  '3. Re-run this workflow after updating key/model.',
                  '',
                  '> Automated fallback comment because model analysis failed.'
                ].join('\n')
              : [
                  `## OPEN_ROUTER Healing Agent (${model})`,
                  '',
                  content,
                  '',
                  '> Generated automatically from the current issue details.'
                ].join('\n');

            const reportDir = path.join(process.env.GITHUB_WORKSPACE, 'healing-reports');
            fs.mkdirSync(reportDir, { recursive: true });
            const reportPath = path.join(reportDir, `openrouter-issue-${issueNumber}.md`);
            const reportMarkdown = [
              `# OPEN_ROUTER Healing Report - Issue #${issueNumber}`,
              '',
              `**Issue:** ${process.env.ISSUE_TITLE}`,
              `**Model:** ${model}`,
              `**Generated at:** ${new Date().toISOString()}`,
              '',
              body
            ].join('\n');
            fs.writeFileSync(reportPath, reportMarkdown, 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            await core.summary
              .addHeading(`OPEN_ROUTER Healing Agent (${model})`)
              .addRaw(apiError ? '**Status:** Failed to analyze with OPEN_ROUTER' : '**Status:** Analysis posted successfully')
              .addEOL()
              .addEOL()
              .addRaw(apiError ? `**Error:** ${apiError}` : 'Issue comment posted with structured diagnostics.')
              .write();

            if (apiError) core.warning(apiError);
            core.setOutput('report_path', `healing-reports/openrouter-issue-${issueNumber}.md`);
            core.setOutput('analysis_status', apiError ? 'failed' : 'ok');

      - name: Apply OPEN_ROUTER patch if provided
        id: apply_patch
        shell: bash
        run: |
          REPORT_PATH="healing-reports/openrouter-issue-${{ github.event.issue.number }}.md"
          PATCH_FILE="openrouter.patch"

          if [ ! -f "$REPORT_PATH" ]; then
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk '
            BEGIN { in_patch=0 }
            /^```diff[[:space:]]*$/ { in_patch=1; next }
            /^```[[:space:]]*$/ && in_patch==1 { in_patch=0; exit }
            { if (in_patch==1) print }
          ' "$REPORT_PATH" > "$PATCH_FILE"

          if [ ! -s "$PATCH_FILE" ]; then
            echo "No patch block detected in report."
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q "^NO_PATCH$" "$PATCH_FILE"; then
            echo "Model returned NO_PATCH."
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git apply --check "$PATCH_FILE" && git apply --index "$PATCH_FILE"; then
            echo "Patch applied successfully."
            STAGED_FILES="$(git diff --cached --name-only)"
            echo "Staged files:"
            echo "$STAGED_FILES"

            if [ -z "$STAGED_FILES" ]; then
              echo "No staged files after patch."
              echo "patch_applied=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Only allow patches that touch repo source surfaces.
            if echo "$STAGED_FILES" | grep -E -v '^(Frontend|Backend)/' > /dev/null; then
              echo "Patch touches non-source paths; rejecting patch."
              git reset
              echo "patch_applied=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Require edits to existing files only (no newly created source files).
            while IFS= read -r f; do
              if [ -n "$f" ] && ! git cat-file -e "HEAD:$f" 2>/dev/null; then
                echo "Patch created new file '$f'; rejecting patch."
                git reset
                echo "patch_applied=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done <<< "$STAGED_FILES"

            # Require at least one concrete code/config file under Frontend or Backend.
            if echo "$STAGED_FILES" | grep -E '^Frontend/.*\.(ts|tsx|js|jsx|html|scss|css|json)$|^Backend/.*\.(ts|tsx|js|jsx|json|cs|csproj|sln|props|targets|config)$' > /dev/null; then
              echo "Real source changes detected."
              echo "patch_applied=true" >> "$GITHUB_OUTPUT"
            else
              echo "Patch does not include valid source file changes; skipping PR."
              git reset
              echo "patch_applied=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Patch apply failed; no PR will be created."
            echo "patch_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update healing PR
        if: ${{ steps.apply_patch.outputs.patch_applied == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: open_router-healing/issue-${{ github.event.issue.number }}
          title: OPEN_ROUTER code fix for issue #${{ github.event.issue.number }}
          body: |
            Automated OPEN_ROUTER generated code changes from issue details.

            Closes #${{ github.event.issue.number }}

            - Analysis status: `${{ steps.analyze.outputs.analysis_status }}`
            - Report file: `${{ steps.analyze.outputs.report_path }}`
            - Patch applied: `${{ steps.apply_patch.outputs.patch_applied || 'false' }}`
          commit-message: "fix(healing): apply OPEN_ROUTER patch for issue #${{ github.event.issue.number }}"
          add-paths: |
            Frontend/**
            Backend/**
