name: Auto Close Stale PRs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-stale-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Close PRs older than 24 hours
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoffMs = 10 * 60 * 60 * 1000;
            const now = Date.now();

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const stalePrs = prs.filter((pr) => {
              if (pr.merged_at) {
                return false;
              }

              const createdAt = new Date(pr.created_at).getTime();
              return Number.isFinite(createdAt) && now - createdAt >= cutoffMs;
            });

            if (stalePrs.length === 0) {
              core.info('No pull requests are older than 24 hours.');
              return;
            }

            for (const pr of stalePrs) {
              const commentBody = [
                '🤖 Proxima Bot:',
                `This pull request has been open for more than 10 hours without merging, so it is being closed automatically.`,
                'If you still need this change, please reopen the PR and try again.'
              ].join('\n\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: commentBody
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed'
              });

              core.info(`Closed stale PR #${pr.number}.`);
            }
