name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge after all checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function getOpenPrsFromEvent() {
              if (context.payload.pull_request) {
                return [context.payload.pull_request.number];
              }

              const headSha = context.payload.check_suite?.head_sha || context.payload.check_run?.head_sha;
              if (!headSha) {
                return [];
              }

              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: headSha
              });

              return associated.data
                .filter((pr) => pr.state === 'open')
                .map((pr) => pr.number);
            }

            async function getReadyPr(prNumber) {
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                const prResponse = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                const pr = prResponse.data;

                if (!pr.draft && pr.mergeable !== null && pr.mergeable_state !== 'unknown') {
                  return pr;
                }

                if (attempt < 4) {
                  core.info(`Waiting for GitHub to finish calculating mergeability for PR #${pr.number} (attempt ${attempt}/4).`);
                  await wait(2500);
                }
              }

              const finalResponse = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              return finalResponse.data;
            }

            const prNumbers = await getOpenPrsFromEvent();
            if (prNumbers.length === 0) {
              core.info('No open pull request found for this event.');
              return;
            }

            for (const prNumber of prNumbers) {
              const pr = await getReadyPr(prNumber);

              if (pr.draft) {
                core.info(`Skipping draft PR #${pr.number}.`);
                continue;
              }

              if (pr.auto_merge) {
                core.info(`Auto-merge already enabled for PR #${pr.number}.`);
                continue;
              }

              const readyForMerge = pr.mergeable === true && pr.mergeable_state === 'clean';
              if (!readyForMerge) {
                core.info(`PR #${pr.number} is not ready for auto-merge yet. mergeable_state=${pr.mergeable_state}, mergeable=${pr.mergeable}`);
                continue;
              }

              try {
                await github.graphql(
                  `mutation EnableAutoMerge($pullRequestId: ID!, $headOid: GitObjectID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH, expectedHeadOid: $headOid }) {
                      pullRequest {
                        number
                      }
                    }
                  }`,
                  {
                    pullRequestId: pr.node_id,
                    headOid: pr.head.sha
                  }
                );

                core.info(`Enabled auto-merge for PR #${pr.number} after all checks passed.`);
              } catch (error) {
                core.warning(`Could not enable auto-merge for PR #${pr.number}: ${error.message}`);
                core.warning('Make sure repository setting "Allow auto-merge" is enabled and branch protection rules are configured.');
              }
            }
