name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
  check_run:
    types: [completed]

permissions:
  contents: write
  checks: read
  pull-requests: write
  statuses: read

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge after all checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function getOpenPrsFromEvent() {
              if (context.payload.pull_request) {
                return [context.payload.pull_request.number];
              }

              const headSha = context.payload.check_suite?.head_sha || context.payload.check_run?.head_sha;
              if (!headSha) {
                return [];
              }

              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: headSha
              });

              return associated.data
                .filter((pr) => pr.state === 'open')
                .map((pr) => pr.number);
            }

            async function allChecksSuccessful(headSha) {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100
              });

              const combined = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: headSha
              });

              const allCheckRunsDone = checks.data.check_runs.every((run) => run.status === 'completed');
              const allCheckRunsGreen = checks.data.check_runs.every((run) =>
                ['success', 'neutral', 'skipped'].includes(String(run.conclusion || ''))
              );

              const allStatusesDone = combined.data.statuses.every((status) => status.state !== 'pending');
              const allStatusesGreen = combined.data.statuses.every((status) =>
                ['success'].includes(String(status.state || ''))
              );

              const combinedStateGreen = ['success'].includes(String(combined.data.state || ''));

              const checksOk = checks.data.total_count === 0 || (allCheckRunsDone && allCheckRunsGreen);
              const statusesOk = combined.data.total_count === 0 || (allStatusesDone && allStatusesGreen && combinedStateGreen);

              return checksOk && statusesOk;
            }

            const prNumbers = await getOpenPrsFromEvent();
            if (prNumbers.length === 0) {
              core.info('No open pull request found for this event.');
              return;
            }

            for (const prNumber of prNumbers) {
              const prResponse = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const pr = prResponse.data;

              if (pr.draft) {
                core.info(`Skipping draft PR #${pr.number}.`);
                continue;
              }

              if (pr.auto_merge) {
                core.info(`Auto-merge already enabled for PR #${pr.number}.`);
                continue;
              }

              const checksPassed = await allChecksSuccessful(pr.head.sha);
              if (!checksPassed) {
                core.info(`Checks are not complete/successful yet for PR #${pr.number}. Waiting for next check event.`);
                continue;
              }

              try {
                await github.graphql(
                  `mutation EnableAutoMerge($pullRequestId: ID!, $headOid: GitObjectID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH, expectedHeadOid: $headOid }) {
                      pullRequest {
                        number
                      }
                    }
                  }`,
                  {
                    pullRequestId: pr.node_id,
                    headOid: pr.head.sha
                  }
                );

                core.info(`Enabled auto-merge for PR #${pr.number} after all checks passed.`);
              } catch (error) {
                core.warning(`Could not enable auto-merge for PR #${pr.number}: ${error.message}`);
                core.warning('Make sure repository setting "Allow auto-merge" is enabled and branch protection rules are configured.');
              }
            }
