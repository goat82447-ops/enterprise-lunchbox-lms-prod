<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f4ff" stroke="#e0e8ff" stroke-width="2"/>
  
  <!-- Car body -->
  <g id="car" opacity="0.6">
    <!-- Main body -->
    <rect x="50" y="90" width="100" height="35" rx="5" fill="none" stroke="#9ca3af" stroke-width="2"/>
    
    <!-- Cabin/roof -->
    <path d="M 70 90 L 80 70 L 120 70 L 130 90" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Left wheel -->
    <circle cx="65" cy="130" r="8" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="65" cy="130" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    
    <!-- Right wheel -->
    <circle cx="135" cy="130" r="8" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="135" cy="130" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    
    <!-- Window -->
    <rect x="75" y="75" width="20" height="15" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    
    <!-- Prohibition slash -->
    <line x1="40" y1="40" x2="160" y2="160" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b7280">
    No Rides
  </text>
</svg>
